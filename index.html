<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Horloge & Alarme</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="clock">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                <span>Horloge</span>
            </button>
            <button class="nav-btn" data-tab="alarm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span>Alarme</span>
            </button>
            <button class="nav-btn" data-tab="stopwatch">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="13" r="8"/>
                    <path d="M12 9v4l2 2"/>
                    <path d="M5 3L2 6"/>
                    <path d="M22 6l-3-3"/>
                    <path d="M12 5V3"/>
                    <path d="M10 3h4"/>
                </svg>
                <span>Chrono</span>
            </button>
            <button class="nav-btn" data-tab="timer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2v6h.01L6 8l4 4-4 4v6h12v-6l-4-4 4-4V2H6z"/>
                </svg>
                <span>Timer</span>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Clock Tab -->
            <section id="clock-tab" class="tab-content active">
                <div class="clock-display">
                    <div class="digital-time" id="digital-clock">00:00:00</div>
                    <div class="date-display" id="date-display"></div>
                </div>
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="hand hour-hand" id="hour-hand"></div>
                        <div class="hand minute-hand" id="minute-hand"></div>
                        <div class="hand second-hand" id="second-hand"></div>
                        <div class="center-dot"></div>
                    </div>
                </div>
            </section>

            <!-- Alarm Tab -->
            <section id="alarm-tab" class="tab-content">
                <div class="alarm-header">
                    <h2>Alarmes</h2>
                    <button class="add-alarm-btn" id="add-alarm-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div class="alarm-list" id="alarm-list">
                    <p class="empty-message">Aucune alarme configurée</p>
                </div>

                <!-- Alarm Modal -->
                <div class="modal" id="alarm-modal">
                    <div class="modal-content">
                        <h3 id="modal-title">Nouvelle Alarme</h3>
                        <div class="time-picker">
                            <div class="time-input-group">
                                <label for="alarm-hours">Heures</label>
                                <input type="number" id="alarm-hours" min="0" max="23" value="7"
                                       inputmode="numeric" pattern="[0-9]*">
                            </div>
                            <span class="time-separator">:</span>
                            <div class="time-input-group">
                                <label for="alarm-minutes">Minutes</label>
                                <input type="number" id="alarm-minutes" min="0" max="59" value="0"
                                       inputmode="numeric" pattern="[0-9]*">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="alarm-label">Libellé</label>
                            <input type="text" id="alarm-label" placeholder="Ex: Réveil matin">
                        </div>
                        <div class="form-group">
                            <label for="alarm-days">Répéter</label>
                            <div class="days-selector">
                                <button class="day-btn" data-day="0">D</button>
                                <button class="day-btn" data-day="1">L</button>
                                <button class="day-btn" data-day="2">M</button>
                                <button class="day-btn" data-day="3">M</button>
                                <button class="day-btn" data-day="4">J</button>
                                <button class="day-btn" data-day="5">V</button>
                                <button class="day-btn" data-day="6">S</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="alarm-sound">Son</label>
                            <select id="alarm-sound">
                                <option value="default">Son par défaut</option>
                                <option value="gentle">Doux réveil</option>
                                <option value="energetic">Énergique</option>
                                <option value="custom">Son personnalisé...</option>
                            </select>
                        </div>
                        <div class="form-group" id="custom-sound-group" style="display: none;">
                            <label for="custom-sound-input">Fichier MP3</label>
                            <input type="file" id="custom-sound-input" accept="audio/mp3,audio/mpeg,audio/wav,audio/*">
                            <span class="custom-sound-name" id="custom-sound-name"></span>
                        </div>
                        <div class="form-group">
                            <button class="test-sound-btn" id="test-sound-btn">
                                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                    <polygon points="5 3 19 12 5 21 5 3"/>
                                </svg>
                                Tester le son
                            </button>
                        </div>
                        <input type="hidden" id="editing-alarm-id" value="">
                        <div class="modal-actions">
                            <button class="btn-cancel" id="cancel-alarm">Annuler</button>
                            <button class="btn-save" id="save-alarm">Enregistrer</button>
                        </div>
                    </div>
                </div>

                <!-- Alarm Ringing Modal -->
                <div class="modal alarm-ringing-modal" id="alarm-ringing-modal">
                    <div class="modal-content ringing-content">
                        <div class="ringing-animation">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ringing-icon">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                        </div>
                        <div class="ringing-time" id="ringing-time">07:00</div>
                        <div class="ringing-label" id="ringing-label">Réveil</div>
                        <div class="ringing-actions">
                            <button class="btn-snooze" id="snooze-btn">
                                <span>Répéter</span>
                                <small>+3 min</small>
                            </button>
                            <button class="btn-dismiss" id="dismiss-btn">Arrêter</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Stopwatch Tab -->
            <section id="stopwatch-tab" class="tab-content">
                <div class="stopwatch-display">
                    <div class="stopwatch-time" id="stopwatch-display">00:00:00<span class="ms">.000</span></div>
                </div>
                <div class="stopwatch-controls">
                    <button class="control-btn secondary" id="stopwatch-reset" disabled>Réinitialiser</button>
                    <button class="control-btn primary" id="stopwatch-start">Démarrer</button>
                    <button class="control-btn secondary" id="stopwatch-lap" disabled>Tour</button>
                </div>
                <div class="laps-container">
                    <div class="laps-list" id="laps-list"></div>
                </div>
            </section>

            <!-- Timer Tab -->
            <section id="timer-tab" class="tab-content">
                <div class="timer-setup" id="timer-setup">
                    <div class="timer-input-container">
                        <div class="timer-input-group">
                            <input type="number" id="timer-hours" min="0" max="99" value="0"
                                   inputmode="numeric" pattern="[0-9]*">
                            <label>heures</label>
                        </div>
                        <span class="timer-separator">:</span>
                        <div class="timer-input-group">
                            <input type="number" id="timer-minutes" min="0" max="59" value="5"
                                   inputmode="numeric" pattern="[0-9]*">
                            <label>min</label>
                        </div>
                        <span class="timer-separator">:</span>
                        <div class="timer-input-group">
                            <input type="number" id="timer-seconds" min="0" max="59" value="0"
                                   inputmode="numeric" pattern="[0-9]*">
                            <label>sec</label>
                        </div>
                    </div>
                    <div class="timer-presets">
                        <button class="preset-btn" data-minutes="1">1 min</button>
                        <button class="preset-btn" data-minutes="3">3 min</button>
                        <button class="preset-btn" data-minutes="5">5 min</button>
                        <button class="preset-btn" data-minutes="10">10 min</button>
                        <button class="preset-btn" data-minutes="15">15 min</button>
                        <button class="preset-btn" data-minutes="30">30 min</button>
                    </div>
                    <div class="timer-sound-select">
                        <label for="timer-sound">Son de fin</label>
                        <select id="timer-sound">
                            <option value="default">Son par défaut</option>
                            <option value="gentle">Doux</option>
                            <option value="energetic">Énergique</option>
                            <option value="custom">Son personnalisé...</option>
                        </select>
                    </div>
                    <div class="form-group" id="timer-custom-sound-group" style="display: none;">
                        <label for="timer-custom-sound-input">Fichier MP3</label>
                        <input type="file" id="timer-custom-sound-input" accept="audio/mp3,audio/mpeg,audio/wav,audio/*">
                        <span class="custom-sound-name" id="timer-custom-sound-name"></span>
                    </div>
                    <button class="control-btn primary large" id="timer-start-btn">Démarrer</button>
                </div>
                <div class="timer-running" id="timer-running" style="display: none;">
                    <div class="timer-circle">
                        <svg class="timer-progress" viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45"/>
                            <circle class="timer-fg" cx="50" cy="50" r="45" id="timer-progress-circle"/>
                        </svg>
                        <div class="timer-display" id="timer-display">00:00:00</div>
                    </div>
                    <div class="timer-controls">
                        <button class="control-btn secondary" id="timer-cancel">Annuler</button>
                        <button class="control-btn primary" id="timer-pause">Pause</button>
                    </div>
                </div>

                <!-- Timer Finished Modal -->
                <div class="modal timer-finished-modal" id="timer-finished-modal">
                    <div class="modal-content ringing-content">
                        <div class="ringing-animation">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ringing-icon">
                                <path d="M6 2v6h.01L6 8l4 4-4 4v6h12v-6l-4-4 4-4V2H6z"/>
                            </svg>
                        </div>
                        <div class="ringing-time">Temps écoulé !</div>
                        <div class="ringing-label" id="timer-finished-duration"></div>
                        <button class="btn-dismiss" id="timer-dismiss-btn">OK</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Audio elements for sounds -->
    <audio id="audio-default" preload="auto"></audio>
    <audio id="audio-custom" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
